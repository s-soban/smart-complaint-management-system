name: Smart Complaint CI & Deployment Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Build Backend (TypeScript Check)
        run: |
          cd backend
          npm run build

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Vite Production Build)
        run: |
          cd frontend
          npm run build

      - name: Output Build Summary
        run: |
          echo "✅ Backend compiled cleanly with tsc"
          echo "✅ Frontend bundled cleanly with Vite"
          echo "🚀 Ready for live deployment!"
